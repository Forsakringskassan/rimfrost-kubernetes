replicaCount: 1

quarkusDefaults:
  resources:
    requests:
      memory: "512Mi"
      cpu: "250m"
    limits:
      memory: "1Gi"
      cpu: "500m"

strimzi:
  enabled: true

postgresql:
  enabled: true
  auth:
    database: rimfrost-test
    username: rimfrost-test
    password: rimfrost-test

kafka:
  enabled: true
  name: dev-kafka
  version: "4.3.0"
  topic: handlaggning-done


quarkus:
  - name: folkbokford
    image:
      repository: ghcr.io/forsakringskassan/folkbokford
      tag: 1.1.1
    waitForKafka: false
  - name: arbetsgivare
    image:
      repository: ghcr.io/forsakringskassan/arbetsgivare
      tag: 1.0.1
    waitForKafka: false
  - name: referensdata
    image:
      repository: ghcr.io/forsakringskassan/rimfrost-service-referensdata
      tag: 1.1.1
    waitForKafka: false
  - name: erbjudande-topic
    image:
      repository: ghcr.io/forsakringskassan/rimfrost-service-erbjudande-topic
      tag: 0.0.1
    waitForKafka: false
  - name: uppgiftslager
    image:
      repository: ghcr.io/forsakringskassan/rimfrost-operativt-uppgiftslager
      tag: 1.7.0
    env:
      - name: MP_MESSAGING_CONNECTOR_SMALLRYE_KAFKA_BOOTSTRAP_SERVERS
        value: "dev-kafka-kafka-bootstrap:9092"
      - name: MP_MESSAGING_CONNECTOR_SMALLRYE_KAFKA_ALLOW_AUTO_CREATE_TOPICS
        value: "true"
      - name: DB_URL
        value: "jdbc:postgresql://rimfrost-k8s-postgresql:5432/rimfrost-test"
      - name: DB_USERNAME
        value: "rimfrost-test"
      - name: DB_PASSWORD
        value: "rimfrost-test"
    waitForKafka: true
    waitForPostgres: true
  - name: vah
    image:
      repository: ghcr.io/forsakringskassan/rimfrost-vard-av-husdjur
      tag: 1.1.6
    env:
      - name: MP_MESSAGING_CONNECTOR_SMALLRYE_KAFKA_BOOTSTRAP_SERVERS
        value: "dev-kafka-kafka-bootstrap:9092"
      - name: MP_MESSAGING_CONNECTOR_SMALLRYE_KAFKA_ALLOW_AUTO_CREATE_TOPICS
        value: "true"
      - name: DB_URL
        value: "jdbc:postgresql://rimfrost-k8s-postgresql:5432/rimfrost-test"
      - name: DB_USERNAME
        value: "rimfrost-test"
      - name: DB_PASSWORD
        value: "rimfrost-test"
    waitForKafka: true
    waitForPostgres: true
  - name: vab
    image:
      repository: ghcr.io/forsakringskassan/rimfrost-vard-av-boskap
      tag: 0.0.3
    env:
      - name: MP_MESSAGING_CONNECTOR_SMALLRYE_KAFKA_BOOTSTRAP_SERVERS
        value: "dev-kafka-kafka-bootstrap:9092"
      - name: MP_MESSAGING_CONNECTOR_SMALLRYE_KAFKA_ALLOW_AUTO_CREATE_TOPICS
        value: "true"
      - name: DB_URL
        value: "jdbc:postgresql://rimfrost-k8s-postgresql:5432/rimfrost-test"
      - name: DB_USERNAME
        value: "rimfrost-test"
      - name: DB_PASSWORD
        value: "rimfrost-test"
    waitForKafka: true
    waitForPostgres: true
  - name: rtf-maskinell
    image:
      repository: ghcr.io/forsakringskassan/rimfrost-regel-rtf-maskinell
      tag: 1.1.5
    env:
      - name: MP_MESSAGING_CONNECTOR_SMALLRYE_KAFKA_BOOTSTRAP_SERVERS
        value: "dev-kafka-kafka-bootstrap:9092"
      - name: MP_MESSAGING_CONNECTOR_SMALLRYE_KAFKA_ALLOW_AUTO_CREATE_TOPICS
        value: "true"
      - name: RIMFROST_FRAMEWORK_REGEL_MASKINELL_RETRY_INTERVALS
        value: 1
    waitForKafka: true
  - name: rtf-manuell
    image:
      repository: ghcr.io/forsakringskassan/rimfrost-regel-rtf-manuell
      tag: 1.3.1
    env:
      - name: MP_MESSAGING_CONNECTOR_SMALLRYE_KAFKA_BOOTSTRAP_SERVERS
        value: "dev-kafka-kafka-bootstrap:9092"
      - name: MP_MESSAGING_CONNECTOR_SMALLRYE_KAFKA_ALLOW_AUTO_CREATE_TOPICS
        value: "true"
      - name: JAVA_TOOL_OPTIONS
        value: "-agentlib:jdwp=transport=dt_socket,server=y,suspend=n,address=*:5005"
      - name: DB_URL
        value: "jdbc:postgresql://rimfrost-k8s-postgresql:5432/rimfrost-test"
      - name: DB_USERNAME
        value: "rimfrost-test"
      - name: DB_PASSWORD
        value: "rimfrost-test"
      - name: SID_API_BASE_URL
        value: "http://rimfrost-k8s-sid:8080"
    waitForKafka: true
    waitForPostgres: true
  - name: rtf-manuell-komplettering
    image:
      repository: ghcr.io/forsakringskassan/rimfrost-regel-rtf-manuell-komplettering
      tag: 0.0.3
    env:
      - name: MP_MESSAGING_CONNECTOR_SMALLRYE_KAFKA_BOOTSTRAP_SERVERS
        value: "dev-kafka-kafka-bootstrap:9092"
      - name: MP_MESSAGING_CONNECTOR_SMALLRYE_KAFKA_ALLOW_AUTO_CREATE_TOPICS
        value: "true"
      - name: JAVA_TOOL_OPTIONS
        value: "-agentlib:jdwp=transport=dt_socket,server=y,suspend=n,address=*:5005"
      - name: DB_URL
        value: "jdbc:postgresql://rimfrost-k8s-postgresql:5432/rimfrost-test"
      - name: DB_USERNAME
        value: "rimfrost-test"
      - name: DB_PASSWORD 
        value: "rimfrost-test"
      - name: SID_API_BASE_URL
        value: "http://rimfrost-k8s-sid:8080"
    waitForKafka: true
    waitForPostgres: true
  - name: bekraftabeslut
    image:
      repository: ghcr.io/forsakringskassan/rimfrost-regel-bekraftabeslut
      tag: 1.1.7
    env:
      - name: MP_MESSAGING_CONNECTOR_SMALLRYE_KAFKA_BOOTSTRAP_SERVERS
        value: "dev-kafka-kafka-bootstrap:9092"
      - name: MP_MESSAGING_CONNECTOR_SMALLRYE_KAFKA_ALLOW_AUTO_CREATE_TOPICS
        value: "true"
      - name: DB_URL
        value: "jdbc:postgresql://rimfrost-k8s-postgresql:5432/rimfrost-test"
      - name: DB_USERNAME
        value: "rimfrost-test"
      - name: DB_PASSWORD
        value: "rimfrost-test"
    waitForKafka: true
    waitForPostgres: true
  - name: team
    image:
      repository: ghcr.io/forsakringskassan/rimfrost-service-team
      tag: 0.1.0
    waitForKafka: false
  - name: sid
    image:
      repository: ghcr.io/forsakringskassan/rimfrost-service-sid
      tag: 0.1.0
    waitForKafka: false
  - name: handlaggning
    image:
      repository: ghcr.io/forsakringskassan/rimfrost-service-handlaggning
      tag: 1.3.2
    waitForKafka: false
  - name: workflow
    image:
      repository: ghcr.io/forsakringskassan/rimfrost-service-workflow
      tag: 0.2.3
    env:
      - name: MP_MESSAGING_CONNECTOR_SMALLRYE_KAFKA_BOOTSTRAP_SERVERS
        value: "dev-kafka-kafka-bootstrap:9092"
      - name: MP_MESSAGING_CONNECTOR_SMALLRYE_KAFKA_ALLOW_AUTO_CREATE_TOPICS
        value: "true"
      - name: DB_URL
        value: "jdbc:postgresql://rimfrost-k8s-postgresql:5432/rimfrost-test"
      - name: DB_USERNAME
        value: "rimfrost-test"
      - name: DB_PASSWORD
        value: "rimfrost-test"
    waitForKafka: true
    waitForPostgres: true
  - name: portal-bff
    image:
      repository: ghcr.io/forsakringskassan/rimfrost-portal-bff
      tag: 2.1.1
    containerPort: 9001
    servicePort: 9001
    env:
      - name: BE_OUL_URL
        value: "http://rimfrost-k8s-uppgiftslager:8080"
      # application-prod.properties overrides quarkus.http.cors.origins with
      # ${CORS_ORIGINS} and no default, so the prod profile needs it set explicitly
      - name: CORS_ORIGINS
        value: "http://localhost:3000,http://localhost:3030"
    waitForKafka: false
  - name: portal-admin-bff
    image:
      repository: ghcr.io/forsakringskassan/rimfrost-portal-admin-bff
      tag: 0.0.3
    containerPort: 9091
    servicePort: 9091
    env:
      - name: BE_OUL_URL
        value: "http://rimfrost-k8s-uppgiftslager:8080"
      - name: BE_OUL_MANAGEMENT_URL
        value: "http://rimfrost-k8s-uppgiftslager:8080"
      # same application-prod.properties CORS_ORIGINS override as portal-bff
      - name: CORS_ORIGINS
        value: "http://localhost:3035"
    waitForKafka: false
  - name: rtf-manuell-bff
    image:
      repository: ghcr.io/forsakringskassan/rimfrost-regel-rtf-manuell-bff
      tag: 0.0.1
    containerPort: 9002
    servicePort: 9002
    env:
      - name: BE_RTF_MANUELL_URL
        value: "http://rimfrost-k8s-rtf-manuell:8080"
    waitForKafka: false
  - name: bekraftabeslut-bff
    image:
      repository: ghcr.io/forsakringskassan/rimfrost-regel-bekraftabeslut-bff
      tag: 0.0.2
    containerPort: 9003
    servicePort: 9003
    env:
      - name: BE_BEKRAFTABESLUT_URL
        value: "http://rimfrost-k8s-bekraftabeslut:8080"
      # same application-prod.properties CORS_ORIGINS override as portal-bff
      - name: CORS_ORIGINS
        value: "http://localhost:3000,http://localhost:3030"
    waitForKafka: false
  - name: template-micro-fe-bff
    image:
      repository: ghcr.io/forsakringskassan/rimfrost-template-micro-fe-bff
      tag: 0.0.2
    containerPort: 9009
    servicePort: 9009
    env:
      - name: BACKEND_URL
        value: "http://rimfrost-k8s-bekraftabeslut:8080/regel/bekraftabeslut"
    waitForKafka: false

ingress:
  enabled: true
  className: "nginx"
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: "10m"
  hosts:
    - paths:
        - path: /api
          pathType: Prefix
          backend: quarkus
