name: Smoke Integration Tests

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - 'renovate/**'

jobs:
  integration-tests:
    name: Run Smoke Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GITHUB_ACTOR: ${{ secrets.PACKAGES_RW_ACTOR }}
      GITHUB_TOKEN: ${{ secrets.PACKAGES_RW_TOKEN }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Set up JDK 21
        uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      # --- Install kubectl ---
      - name: Install kubectl
        run: |
          curl -LO "https://dl.k8s.io/release/$(curl -L -s https://dl.k8s.io/release/stable.txt)/bin/linux/amd64/kubectl"
          chmod +x kubectl
          sudo mv kubectl /usr/local/bin/

      # --- Install Minikube ---
      - name: Install Minikube
        run: |
          curl -Lo minikube https://storage.googleapis.com/minikube/releases/latest/minikube-linux-amd64
          chmod +x minikube
          sudo mv minikube /usr/local/bin/

      # --- Install Helm ---
      - name: Install Helm
        run: |
          curl https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-3 | bash

      # --- Run integration tests ---
      - name: Run Maven verify
        run: mvn -s settings.xml verify

      # --- Optional: Dump logs on failure ---
      - name: Dump Kubernetes logs
        if: failure()
        run: |
          mkdir -p k8s-logs
          kubectl get all -A > k8s-logs/get-all.txt
          kubectl describe pods -A > k8s-logs/describe-pods.txt
          for name in $(kubectl get pods -o name); do
            kubectl logs "${name}" --all-containers --prefix > "k8s-logs/${name#pod/}.log" 2>&1 || true
            kubectl logs "${name}" --all-containers --previous > "k8s-logs/${name#pod/}.previous.log" 2>/dev/null || true
          done
          find k8s-logs/ -empty -delete || true
          kubectl exec dev-kafka-dev-kafka-combined-0 -- bin/kafka-consumer-groups.sh \
            --bootstrap-server localhost:9092 --describe --all-groups > k8s-logs/consumer-groups.txt 2>&1 || true
        shell: bash

      - name: Upload logs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: k8s-logs
          path: k8s-logs/
